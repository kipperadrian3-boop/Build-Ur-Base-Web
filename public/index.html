<!DOCTYPE string>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Ur Base - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container" id="loginView">
        <div class="logo">
            <h1>Build Ur Base</h1>
            <p>Enter your Web-Code from the Roblox game to log in.</p>
        </div>
        
        <div class="input-group">
            <input type="text" id="codeInput" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" autocomplete="off">
            <button id="loginBtn">Connect</button>
        </div>

        <p id="statusMessage" class="status-message"></p>
    </div>

    <!-- Main App View (Hidden by default) -->
    <div id="mainAppView" class="main-app hidden">
        <!-- Dashboard Profile Header -->
        <div class="profile-header">
            <div class="avatar-placeholder"></div>
            <div class="profile-info">
                <h2><span id="playerName">Player</span></h2>
                <div class="stats-row">
                    <span id="playerCash" class="player-cash">🪙 0</span>
                </div>
                <button id="logoutBtn" class="logout-btn">Log Out</button>
            </div>
            <div class="status-indicator-container">
                <div id="serverStatus" class="status-indicator offline">Server: Offline</div>
            </div>
        </div>

        <!-- Index View -->
        <div id="indexView" class="view-content">
            <div class="top-tabs">
                <button class="tab-btn active" data-tab="Blocks">Blocks</button>
                <button class="tab-btn" data-tab="Decor">Decor</button>
                <button class="tab-btn" data-tab="Defense">Defense</button>
                <button class="tab-btn" data-tab="Chests">Chests</button>
            </div>
            <div class="items-grid" id="itemsGrid">
                <!-- Items injected here by JS -->
            </div>
        </div>

        <!-- Shop View -->
        <div id="shopView" class="view-content hidden">
            <div class="top-tabs">
                <button class="tab-btn active" data-shoptab="Blocks">Blocks</button>
                <button class="tab-btn" data-shoptab="Decor">Decor</button>
                <button class="tab-btn" data-shoptab="Defense">Defense</button>
                <button class="tab-btn" data-shoptab="Chests">Chests</button>
            </div>
            <div class="shop-list" id="shopList">
                <!-- Shop items injected here by JS -->
            </div>
        </div>

        <!-- Daily Rewards View -->
        <div id="dailyView" class="view-content daily-view-layout hidden">
            <div class="daily-header-card">
                <div class="daily-header-top">
                    <div class="daily-streak-badge" id="dailyStreakBadge">Streak: Day 1 / 7</div>
                    <div class="daily-timer-badge" id="dailyTimerBadge">Checking...</div>
                </div>
                <div class="daily-subtitle" id="dailySubtitle">Claim your reward every 24 hours!</div>
            </div>
            <div class="daily-scroll-container">
                <div class="daily-rewards-list" id="dailyRewardsList">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" id="navIndexBtn">Index</button>
            <button class="nav-btn" id="navShopBtn">Shop</button>
            <button class="nav-btn" id="navDailyBtn">Daily Rewards</button>
        </nav>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
